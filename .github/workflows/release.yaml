name: Release full-source asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to package
        required: true
        type: string

permissions: {}

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_gitlinks: ${{ steps.source-shape.outputs.has_gitlinks }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate release and fetch selected source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          rm -rf source
          git clone --quiet --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" source
          git -C source fetch --quiet --force --tags origin
          test "$(git -C source cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git -C source rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Detect source gitlinks
        id: source-shape
        run: |
          set -Eeuo pipefail
          if git -C source ls-tree -r "refs/tags/$RELEASE_TAG" | grep -q '^160000 '; then
            echo 'has_gitlinks=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_gitlinks=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build full-source archive
        if: steps.source-shape.outputs.has_gitlinks == 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/full-source"
          python3 tools/build_full_source.py \
            --repo "$GITHUB_WORKSPACE/source" \
            --ref "refs/tags/$RELEASE_TAG" \
            --version "$RELEASE_TAG" \
            --output-dir "$RUNNER_TEMP/full-source"

      - name: Extract and validate full-source archive
        if: steps.source-shape.outputs.has_gitlinks == 'true'
        run: |
          set -Eeuo pipefail
          archive_version="${RELEASE_TAG#v}"
          python3 tools/validate_full_source.py \
            --archive "$RUNNER_TEMP/full-source/devlegate-$archive_version-full-source.tar.gz" \
            --sidecar "$RUNNER_TEMP/full-source/devlegate-$archive_version-full-source.tar.gz.sha256" \
            --repo "$GITHUB_WORKSPACE/source" \
            --ref "refs/tags/$RELEASE_TAG" \
            --version "$RELEASE_TAG" \
            --extract-dir "$RUNNER_TEMP/full-source-extracted"

      - name: Run extracted source checks when supported
        if: steps.source-shape.outputs.has_gitlinks == 'true'
        run: |
          set -Eeuo pipefail
          archive_version="${RELEASE_TAG#v}"
          extracted="$RUNNER_TEMP/full-source-extracted/devlegate-$archive_version"
          if [[ -x "$extracted/dev" && -f "$extracted/pyproject.toml" ]] \
            && grep -q '^  setup)' "$extracted/dev" \
            && grep -q '^  check)' "$extracted/dev"; then
            (cd "$extracted" && ./dev setup && ./dev check)
          else
            printf 'Skipping modern Devlegate checks for this historical source tree\n'
          fi

      - name: Publish validated workflow artifact
        if: steps.source-shape.outputs.has_gitlinks == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: full-source-${{ steps.release.outputs.release_tag }}
          path: ${{ runner.temp }}/full-source/
          if-no-files-found: error

  upload-release-assets:
    needs: build-and-validate
    if: needs.build-and-validate.outputs.has_gitlinks == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build-and-validate.outputs.release_tag }}
    steps:
      - name: Download validated full-source assets
        uses: actions/download-artifact@v8
        with:
          name: full-source-${{ needs.build-and-validate.outputs.release_tag }}
          path: full-source

      - name: Upload validated assets to exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          archive_version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "full-source/devlegate-$archive_version-full-source.tar.gz" \
            "full-source/devlegate-$archive_version-full-source.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
