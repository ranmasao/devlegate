name: CI

on:
  push:
    branches-ignore:
      - badges
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up development environment
        run: ./dev setup

      - name: Run tests with coverage
        run: ./dev coverage -n 4 --dist=worksteal

      - name: Generate coverage badge payload
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text())
          percentage = report["totals"]["percent_covered"]
          if percentage >= 90:
              color = "brightgreen"
          elif percentage >= 80:
              color = "green"
          elif percentage >= 70:
              color = "yellowgreen"
          elif percentage >= 60:
              color = "yellow"
          elif percentage >= 50:
              color = "orange"
          else:
              color = "red"
          Path("coverage-badge.json").write_text(json.dumps({
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{percentage:.0f}%",
              "color": color,
          }) + "\n")
          PY

      - name: Upload coverage badge payload
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.json

      - name: Run Ruff
        run: ./dev lint

  publish-coverage:
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/release/'))
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage badge payload
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: coverage-artifact

      - name: Publish badges branch
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/publish_coverage.py "$BRANCH" "$DEFAULT_BRANCH" "$COMMIT" coverage-artifact/coverage-badge.json
