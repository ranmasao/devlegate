[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "devlegate"
version = "0.5.3.dev0"
description = "Local deterministic orchestrator for agent-driven software development."
readme = "README.md"
license = "EUPL-1.2 AND CC0-1.0 AND MIT"
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSING.md",
    "LICENSES/*",
    "src/devlegate/_vendor/nanoyaml/LICENSE",
]
requires-python = ">=3.12"
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux"]

[project.urls]
Repository = "https://github.com/ranmasao/devlegate"

[project.optional-dependencies]
dev = [
    "coverage>=7.12",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]

[project.scripts]
devlegate = "devlegate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devlegate = ["default_templates/.env.example", "default_templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source_pkgs = ["devlegate"]
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["src/devlegate/_vendor/nanoyaml"]

[tool.ruff.lint]
select = ["E", "F", "I"]
